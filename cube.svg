<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变 -->
  <defs>
    <!-- 顶面渐变 (亮) -->
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 左面渐变 (中等) -->
    <linearGradient id="leftGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 右面渐变 (暗) -->
    <linearGradient id="rightGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#808080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#606060;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 正方体 - 等轴测视图 -->
  <!-- 顶面 (菱形) -->
  <polygon points="100,40 160,75 100,110 40,75" 
           fill="url(#topGradient)" 
           stroke="#333" 
           stroke-width="1.5"/>
  
  <!-- 左面 (平行四边形) -->
  <polygon points="40,75 100,110 100,170 40,135" 
           fill="url(#leftGradient)" 
           stroke="#333" 
           stroke-width="1.5"/>
  
  <!-- 右面 (平行四边形) -->
  <polygon points="100,110 160,75 160,135 100,170" 
           fill="url(#rightGradient)" 
           stroke="#333" 
           stroke-width="1.5"/>
</svg>

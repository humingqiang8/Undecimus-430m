<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变 -->
  <defs>
    <!-- 顶部椭圆渐变 -->
    <radialGradient id="topGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8b8b8;stop-opacity:1" />
    </radialGradient>
    
    <!-- 侧面渐变 -->
    <linearGradient id="sideGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#909090;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#909090;stop-opacity:1" />
    </linearGradient>
    
    <!-- 底部椭圆渐变 -->
    <radialGradient id="bottomGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a0a0a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#707070;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- 圆柱体侧面 -->
  <rect x="100" y="100" width="100" height="200" fill="url(#sideGradient)" />
  
  <!-- 顶部椭圆 -->
  <ellipse cx="150" cy="100" rx="50" ry="20" fill="url(#topGradient)" stroke="#808080" stroke-width="1" />
  
  <!-- 底部椭圆（只显示前半部分） -->
  <ellipse cx="150" cy="300" rx="50" ry="20" fill="url(#bottomGradient)" stroke="#606060" stroke-width="1" />
  
  <!-- 侧面轮廓线 -->
  <line x1="100" y1="100" x2="100" y2="300" stroke="#606060" stroke-width="1" opacity="0.5" />
  <line x1="200" y1="100" x2="200" y2="300" stroke="#606060" stroke-width="1" opacity="0.5" />
  
  <!-- 高光效果 -->
  <ellipse cx="150" cy="100" rx="50" ry="20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" />
  <path d="M 110 150 Q 105 200 110 250" stroke="#ffffff" stroke-width="2" opacity="0.4" fill="none" />
</svg>

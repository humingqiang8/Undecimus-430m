<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变 -->
  <defs>
    <!-- 顶面渐变 (最亮) -->
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8d5ba;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7cb590;stop-opacity:1" />
    </linearGradient>
    
    <!-- 左前面渐变 (中等亮度) -->
    <linearGradient id="leftGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6da382;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a8565;stop-opacity:1" />
    </linearGradient>
    
    <!-- 右前面渐变 (最暗) -->
    <linearGradient id="rightGradient" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#5a9475;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d7a5e;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 标题 -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333" font-weight="bold">长方体 (Rectangular Prism)</text>
  
  <!-- 长方体组 -->
  <g transform="translate(200, 150)" filter="url(#shadow)">
    <!-- 右前面 (较暗) -->
    <polygon 
      points="0,-40 60,-10 60,90 0,60" 
      fill="url(#rightGradient)" 
      stroke="#2d5a45" 
      stroke-width="2"
    />
    
    <!-- 左前面 (中等亮度) -->
    <polygon 
      points="0,-40 -80,-10 -80,90 0,60" 
      fill="url(#leftGradient)" 
      stroke="#2d5a45" 
      stroke-width="2"
    />
    
    <!-- 顶面 (最亮) -->
    <polygon 
      points="0,-40 60,-10 -80,-10 0,-40" 
      fill="url(#topGradient)" 
      stroke="#2d5a45" 
      stroke-width="2"
    />
    
    <!-- 被遮挡的边线 (虚线) -->
    <line x1="-80" y1="90" x2="-20" y2="60" stroke="#2d5a45" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
    <line x1="60" y1="90" x2="0" y2="60" stroke="#2d5a45" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
    <line x1="-20" y1="60" x2="0" y2="60" stroke="#2d5a45" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
  </g>
  
  <!-- 说明文字 -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    等轴测视图 • 三个可见面 • 不同亮度模拟光照
  </text>
</svg>

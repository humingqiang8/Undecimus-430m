<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 左面渐变 (较暗) -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5aa0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 右面渐变 (中等亮度) -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5ba3f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a7bc8;stop-opacity:1" />
    </linearGradient>
    
    <!-- 顶面渐变 (最亮) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7cb8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="300" fill="#f5f5f5"/>
  
  <!-- 三角锥体 (四面体) -->
  <g transform="translate(150, 160)" filter="url(#shadow)">
    <!-- 左前面 -->
    <polygon 
      points="-60,60 0,-80 -30,20" 
      fill="url(#leftFace)" 
      stroke="#1a3d66" 
      stroke-width="1.5"
    />
    
    <!-- 右前面 -->
    <polygon 
      points="60,60 0,-80 30,20" 
      fill="url(#rightFace)" 
      stroke="#1a3d66" 
      stroke-width="1.5"
    />
    
    <!-- 顶面 (后面可见部分) -->
    <polygon 
      points="-30,20 0,-80 30,20" 
      fill="url(#topFace)" 
      stroke="#1a3d66" 
      stroke-width="1.5"
    />
    
    <!-- 底边线 (虚线表示被遮挡) -->
    <line 
      x1="-60" y1="60" 
      x2="60" y2="60" 
      stroke="#1a3d66" 
      stroke-width="1" 
      stroke-dasharray="4,2"
      opacity="0.6"
    />
  </g>
  
  <!-- 标题 -->
  <text x="150" y="280" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">
    三角锥体 (四面体)
  </text>
</svg>
